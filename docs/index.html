<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首都圏 駅別ラーメンDB ビューア 🍜</title>
<style>
  :root{
    --bg:#faf7f2; --card:#fff; --ink:#26201a; --sub:#7a6f63; --line:#e7ddd0;
    --accent:#c0392b; --accent2:#e67e22; --chip:#f1e8da; --hit:#fff7ed;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    line-height:1.5;}
  header{background:linear-gradient(135deg,#c0392b,#e67e22);color:#fff;padding:18px 16px;}
  header h1{margin:0;font-size:20px;}
  header p{margin:4px 0 0;font-size:12px;opacity:.92;}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 12px 60px;}
  .controls{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin:14px 0;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;}
  .controls .full{grid-column:1/-1;}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px;font-weight:600;}
  input[type=search],select{width:100%;padding:8px 9px;font-size:14px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .checks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .checks label{display:inline-flex;gap:5px;align-items:center;margin:0;font-size:13px;
    color:var(--ink);font-weight:500;cursor:pointer;}
  .checks .sep{color:var(--line);padding:0 2px;font-size:16px;}
  .today-lbl{background:#e8f5e9;border-radius:6px;padding:2px 8px;color:#2e7d32 !important;font-weight:600 !important;}
  .want-lbl{background:#fff8e1;border-radius:6px;padding:2px 8px;color:#795548 !important;}
  .bar{display:flex;justify-content:space-between;align-items:flex-start;
    gap:10px;flex-wrap:wrap;margin:6px 2px;}
  .bar-left{display:flex;flex-direction:column;gap:2px;}
  .bar-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .count{font-size:13px;color:var(--sub);}
  .count b{color:var(--accent);font-size:16px;}
  .stamp-count{font-size:11.5px;color:var(--sub);}
  .btn-sm{font-size:12px;background:none;border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;cursor:pointer;color:var(--sub);}
  .btn-sm:hover{background:var(--chip);}
  table{width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px;}
  thead th{background:#f3ece0;text-align:left;padding:9px 10px;font-size:12px;color:var(--sub);
    cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0;}
  thead th:hover{color:var(--accent);}
  thead th.no-sort{cursor:default;}
  thead th.no-sort:hover{color:var(--sub);}
  tbody td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:var(--hit);}
  tbody tr.visited td:not(.td-stamp){opacity:.38;}
  .shop a{color:var(--accent);text-decoration:none;font-weight:600;}
  .shop a:hover{text-decoration:underline;}
  .shop .nourl{font-weight:600;}
  .score{font-variant-numeric:tabular-nums;font-weight:700;}
  .loc,.feat{color:var(--sub);}
  .feat{font-size:12px;}
  .chips{display:flex;gap:4px;flex-wrap:wrap;}
  .chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px;color:#6b5d4b;white-space:nowrap;}
  .badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-right:3px;}
  .b-star{background:#fde2e0;color:#b03227;}
  .b-bib{background:#fdebd6;color:#a85b12;}
  .b-hyaku{background:#e6efe0;color:#3f6b2f;}
  .empty{padding:30px;text-align:center;color:var(--sub);}
  /* Stamp buttons */
  .td-stamp{white-space:nowrap;padding:6px 7px;}
  .s-btn{border:none;cursor:pointer;border-radius:6px;padding:2px 7px;
    font-size:13px;background:var(--chip);color:var(--sub);line-height:1.5;transition:background .1s;}
  .s-btn:hover{opacity:.75;}
  .s-btn.sv{background:#c8e6c9;color:#1b5e20;}
  .s-btn.sw{background:#fff3cd;color:#7c4b00;}
  footer{color:var(--sub);font-size:11.5px;margin-top:18px;text-align:center;}
  footer a{color:var(--sub);}
  @media(max-width:680px){
    .hide-sp{display:none;}
    .wrap{padding:10px 8px 50px;}
  }
</style>
</head>
<body>
<header>
  <h1>🍜 首都圏 駅別ラーメンDB ビューア</h1>
  <p>東京・神奈川・埼玉・千葉 ／ 都県・区・ジャンル・路線・曜日・スタンプで絞り込み（食べログ点数は掲載時点の目安）</p>
</header>

<div class="wrap">
  <div class="controls">
    <div class="full">
      <label for="q">キーワード（店名・駅名・特徴）</label>
      <input type="search" id="q" placeholder="例: 煮干し / 二郎 / 高田馬場 / 鳴龍">
    </div>
    <!-- Feature 4: 沿線フィルタ -->
    <div class="full">
      <label for="line">🚃 路線で絞る</label>
      <input type="search" id="line" placeholder="例: 山手線 / 中央線 / 東西線 / 小田急 / つくばEX / 京急">
    </div>
    <div>
      <label for="pref">都県</label>
      <select id="pref"><option value="">すべての都県</option></select>
    </div>
    <div>
      <label for="ward">区・市</label>
      <select id="ward"><option value="">すべての区・市</option></select>
    </div>
    <div>
      <label for="genre">ジャンル</label>
      <select id="genre"><option value="">すべてのジャンル</option></select>
    </div>
    <div>
      <label for="minscore">食べログ点数（以上）</label>
      <select id="minscore">
        <option value="0">指定なし</option>
        <option value="3.5">3.5+</option>
        <option value="3.6">3.6+</option>
        <option value="3.7">3.7+</option>
        <option value="3.75">3.75+</option>
        <option value="3.8">3.8+</option>
      </select>
    </div>
    <div>
      <label for="sort">並び替え</label>
      <select id="sort">
        <option value="score">点数が高い順</option>
        <option value="ward">区順</option>
        <option value="shop">店名順</option>
      </select>
    </div>
    <div class="full">
      <label>絞り込みオプション</label>
      <div class="checks">
        <label><input type="checkbox" id="c-star"> ⭐ ミシュラン星</label>
        <label><input type="checkbox" id="c-bib"> 🅱️ ビブグルマン</label>
        <label><input type="checkbox" id="c-hyaku"> 💯 百名店</label>
        <span class="sep">|</span>
        <!-- Feature 1: 曜日フィルタ -->
        <label class="today-lbl" id="today-lbl-wrap"
          title="定休日が判明している店のうち、今日定休の店を除外します。定休日データがない店は「開いている可能性あり」として表示します。">
          <input type="checkbox" id="c-today">
          📅 <span id="today-day">?</span>曜日に開いてる
        </label>
        <span class="sep">|</span>
        <!-- Feature 2: スタンプフィルタ -->
        <label><input type="checkbox" id="c-unvisited"> ✓ 未訪問のみ</label>
        <label class="want-lbl"><input type="checkbox" id="c-want"> ★ 気になるのみ</label>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="bar-left">
      <div class="count"><b id="n">–</b> 店 / 全 <span id="total">–</span> 店</div>
      <div class="stamp-count" id="stamp-count">✓ 訪問済: 0店 ／ ★ 気になる: 0店</div>
    </div>
    <div class="bar-right">
      <button class="btn-sm" id="clear-stamps">スタンプをリセット</button>
      <button class="btn-sm" id="reset">条件をクリア</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th data-k="shop">店名</th>
        <th data-k="ward">区・最寄駅</th>
        <th data-k="genre" class="hide-sp">ジャンル</th>
        <th data-k="score">点数</th>
        <th data-k="awards" class="hide-sp">認定</th>
        <th class="hide-sp">特徴</th>
        <th class="no-sort" title="訪問スタンプ">📌</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">読み込み中…</td></tr></tbody>
  </table>

  <footer>
    データ: <a href="data/ramen.json">ramen.json</a>（<code>scripts/build_indexes.py</code> 自動生成） /
    全店「実在・営業中」確認済。閉店・時間変更は随時あり得るため訪問前に最新情報を確認ください。
    曜日フィルタは定休日データが判明している店のみ有効。スタンプはブラウザのローカルに保存されます。
  </footer>
</div>

<script>
const PREF_ORDER = ["東京都","東京都(多摩)","神奈川県","埼玉県","千葉県"];
const DAY_ENG  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WEEK_JP  = ["日","月","火","水","木","金","土"];
const TODAY_IDX = new Date().getDay();
const TODAY_ENG = DAY_ENG[TODAY_IDX];

document.getElementById("today-day").textContent = WEEK_JP[TODAY_IDX];

let DATA = [];
let STAMPS = {};
try { STAMPS = JSON.parse(localStorage.getItem("ramen_stamps") || "{}"); } catch(e) {}

const $ = s => document.querySelector(s);
const els = {
  q:      $("#q"),
  line:   $("#line"),
  pref:   $("#pref"),
  ward:   $("#ward"),
  genre:  $("#genre"),
  min:    $("#minscore"),
  sort:   $("#sort"),
  star:   $("#c-star"),
  bib:    $("#c-bib"),
  hyaku:  $("#c-hyaku"),
  today:  $("#c-today"),
  unvisited: $("#c-unvisited"),
  want:   $("#c-want"),
  rows:   $("#rows"),
  n:      $("#n"),
  total:  $("#total"),
  reset:  $("#reset"),
  stampCount:  $("#stamp-count"),
  clearStamps: $("#clear-stamps"),
};

function stampKey(r){ return r.source_url || (r.shop + "||" + r.pref + "||" + r.ward); }
function saveStamps(){ localStorage.setItem("ramen_stamps", JSON.stringify(STAMPS)); }

function esc(s){
  return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function badges(aw){
  return (aw||[]).map(a => {
    if(a==="ミシュラン星") return '<span class="badge b-star">⭐星</span>';
    if(a==="ビブグルマン") return '<span class="badge b-bib">🅱️ビブ</span>';
    if(a==="百名店")      return '<span class="badge b-hyaku">💯百</span>';
    return "";
  }).join("");
}

function passes(r){
  // キーワード
  const q = els.q.value.trim().toLowerCase();
  if(q){
    const hay = (r.shop + " " + (r.stations||[]).join(" ") + " " + r.ward + " " +
                 r.genre + " " + (r.feature||"") + " " + (r.lines||[]).join(" ")).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  // Feature 4: 路線
  const lineQ = els.line.value.trim().toLowerCase();
  if(lineQ && !(r.lines||[]).some(l => l.toLowerCase().includes(lineQ))) return false;
  // 都県・区・ジャンル
  if(els.pref.value && r.pref !== els.pref.value) return false;
  if(els.ward.value && r.ward !== els.ward.value) return false;
  if(els.genre.value && !(r.genres||[]).includes(els.genre.value)) return false;
  // 点数
  const min = parseFloat(els.min.value);
  if(min > 0 && !(r.tabelog_score && r.tabelog_score >= min)) return false;
  // 認定
  if(els.star.checked  && !(r.awards||[]).includes("ミシュラン星")) return false;
  if(els.bib.checked   && !(r.awards||[]).includes("ビブグルマン")) return false;
  if(els.hyaku.checked && !(r.awards||[]).includes("百名店"))       return false;
  // Feature 1: 今日開いてる
  if(els.today.checked){
    const cd = r.closed_days || [];
    if(cd.includes(TODAY_ENG)) return false;
  }
  // Feature 2: スタンプフィルタ
  const key = stampKey(r);
  const stamp = STAMPS[key];
  if(els.unvisited.checked && stamp === "visited") return false;
  if(els.want.checked      && stamp !== "want")    return false;
  return true;
}

function sortRows(rows){
  const k = els.sort.value;
  const sc = r => (r.tabelog_score || 0);
  const pi = r => { const i = PREF_ORDER.indexOf(r.pref); return i < 0 ? 99 : i; };
  if(k === "score") rows.sort((a,b) => sc(b)-sc(a) || a.shop.localeCompare(b.shop,"ja"));
  else if(k === "shop") rows.sort((a,b) => a.shop.localeCompare(b.shop,"ja"));
  else if(k === "ward") rows.sort((a,b) => (pi(a)-pi(b)) || a.ward.localeCompare(b.ward,"ja") || sc(b)-sc(a));
  return rows;
}

function updateStampCount(){
  const v = Object.values(STAMPS).filter(s => s === "visited").length;
  const w = Object.values(STAMPS).filter(s => s === "want").length;
  els.stampCount.textContent = `✓ 訪問済: ${v}店 ／ ★ 気になる: ${w}店`;
}

function render(){
  const rows = sortRows(DATA.filter(passes));
  els.n.textContent = rows.length;
  updateStampCount();
  if(!rows.length){
    els.rows.innerHTML = '<tr><td colspan="7" class="empty">条件に合う店が見つかりませんでした。</td></tr>';
    return;
  }
  const html = rows.map(r => {
    const key   = stampKey(r);
    const stamp = STAMPS[key];
    const sv    = stamp === "visited";
    const sw    = stamp === "want";
    const name  = r.source_url
      ? `<a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.shop)}</a>`
      : `<span class="nourl">${esc(r.shop)}</span>`;
    const loc   = `${esc(r.pref||"")} ${esc(r.ward)}<br><span class="loc">${esc((r.stations||[]).join(" / "))}</span>`;
    const score = r.tabelog_score ? r.tabelog_score.toFixed(2) : "–";
    const chips = `<div class="chips">${(r.genres||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>`;
    const vBtn  = `<button class="s-btn${sv?" sv":""}" data-action="visited" data-key="${esc(key)}" title="行った">✓</button>`;
    const wBtn  = `<button class="s-btn${sw?" sw":""}" data-action="want"    data-key="${esc(key)}" title="気になる">★</button>`;
    return `<tr${sv?' class="visited"':''}>
      <td class="shop">${name}${(r.awards&&r.awards.length)?("<br>"+badges(r.awards)):""}</td>
      <td>${loc}</td>
      <td class="hide-sp">${chips}</td>
      <td class="score">${score}</td>
      <td class="hide-sp">${badges(r.awards)||"–"}</td>
      <td class="feat hide-sp">${esc(r.feature||"")}</td>
      <td class="td-stamp">${vBtn}${wBtn}</td>
    </tr>`;
  }).join("");
  els.rows.innerHTML = html;
}

// Event delegation for stamp buttons (survives innerHTML replacement)
function initStampHandlers(){
  els.rows.addEventListener("click", e => {
    const btn = e.target.closest(".s-btn");
    if(!btn) return;
    const key    = btn.dataset.key;
    const action = btn.dataset.action;
    STAMPS[key]  = STAMPS[key] === action ? null : action;
    saveStamps();
    render();
  });
}

function fillWards(){
  els.ward.innerHTML = '<option value="">すべての区・市</option>';
  const pref = els.pref.value;
  const seen = [];
  for(const r of DATA){
    if(pref && r.pref !== pref) continue;
    if(!seen.includes(r.ward)) seen.push(r.ward);
  }
  seen.sort((a,b) => a.localeCompare(b,"ja"));
  for(const w of seen){
    const o = document.createElement("option");
    o.value = w; o.textContent = w;
    els.ward.appendChild(o);
  }
}

function initFilters(){
  // 都県（固定順）
  for(const p of PREF_ORDER.filter(p => DATA.some(r => r.pref === p))){
    const o = document.createElement("option");
    o.value = p; o.textContent = `${p}（${DATA.filter(r => r.pref === p).length}）`;
    els.pref.appendChild(o);
  }
  fillWards();
  // ジャンル（出現頻度順）
  const gc = {};
  for(const r of DATA) for(const g of (r.genres||[])) gc[g] = (gc[g]||0) + 1;
  for(const g of Object.keys(gc).sort((a,b) => gc[b]-gc[a])){
    const o = document.createElement("option");
    o.value = g; o.textContent = `${g}（${gc[g]}）`;
    els.genre.appendChild(o);
  }
}

function bind(){
  els.pref.addEventListener("change", () => { fillWards(); render(); });
  for(const el of [
    els.q, els.line, els.ward, els.genre, els.min, els.sort,
    els.star, els.bib, els.hyaku, els.today, els.unvisited, els.want,
  ]){
    el.addEventListener("input", render);
  }
  // ヘッダクリックでソート
  document.querySelectorAll("thead th[data-k]").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      els.sort.value = (k==="score"||k==="ward"||k==="shop") ? k : "score";
      render();
    });
  });
  // 条件クリア（スタンプは保持）
  els.reset.addEventListener("click", () => {
    els.q.value = ""; els.line.value = "";
    els.pref.value = ""; els.genre.value = "";
    els.min.value = "0"; els.sort.value = "score";
    els.star.checked = els.bib.checked = els.hyaku.checked = false;
    els.today.checked = els.unvisited.checked = els.want.checked = false;
    fillWards(); render();
  });
  // スタンプ全消去
  els.clearStamps.addEventListener("click", () => {
    if(!confirm("訪問済・気になるのスタンプをすべて消去しますか？")) return;
    STAMPS = {};
    saveStamps();
    render();
  });
}

fetch("data/ramen.json")
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    els.total.textContent = d.length;
    initFilters(); bind(); initStampHandlers(); render();
  })
  .catch(e => {
    els.rows.innerHTML = `<tr><td colspan="7" class="empty">データの読み込みに失敗しました（${esc(String(e))}）。<br>GitHub Pages 上では正しく表示されます。</td></tr>`;
  });
</script>
</body>
</html>
